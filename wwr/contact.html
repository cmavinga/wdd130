<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting Company</title>
    <meta name="description"
      content="Contact our Whitewater Rafting Company for inquiries, bookings, or more information about our exciting river adventures.">
    <meta name="author" content="Christian MAVINGA">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <div class="grid">
            <img src="images/companylogo.jpg" alt="wwr company logo" width="200" height="100">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </div>
    </header>

    <main>
        <section>
            <h1>White Water Rafting Company</h1>
            <p>123 Main Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>
        <div class="contact-container">

            <!-- Left side -->
            <!-- <div class="map"> -->
            <img src="images/nilerivermap.jpg" alt="Nile River Map" width="200">
            <!-- </div> -->

            <!-- Right side -->
            <!-- <div class="form"> -->
            <form>
                <label for="username">Name</label>
                <input type="text" id="username" name="username" placeholder="Christian Mavinga">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="mavingac5@gmail.com">
                <p>Message Purpose</p>
                <label>
                    <input type="radio" id="purpose" name="purpose"> General Inquiry
                </label>
                <label>
                    <input type="radio" id="reservation" name="purpose"> Reservation Question
                </label>
                <label>
                    <input type="radio" id="suggestion" name="purpose"> Website Suggestion
                </label>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>
                <label><input type="checkbox" id="newsletter" name="newsletter">Please subscribe
                    me to
                    the monthly newsletter"</label>
                <button type="submit">Get in touch!</button>
            </form>
        </div>
        <aside>
            <h2>We Are Here to Serve You</h2>

            <div class="team">
                <div class="employee">
                    <img src="images/employeeprofile.jpg" alt="Employee Profile" width="100">
                    <p>CEO</p>
                </div>

                <div class="employee">
                    <img src="images/employeeprofile.jpg" alt="Employee Profile" width="100">
                    <p>Travel Manager</p>
                </div>

                <div class="employee">
                    <img src="images/employeeprofile.jpg" alt="Employee Profile" width="100">
                    <p>Coordinator</p>
                </div>
            </div>
        </aside>
        <footer>
            <p>©2026 🌴 Mavinga Nsuka Christian 🌴 Whitewater Rafting Company</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.jpg" alt="Facebook">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.jpg" alt="Instagram">
                </a>
                <a href="https://LinkedIn.com">
                    <img src="images/linkendin.jpg" alt="LinkedIn">
                </a>
            </nav>
        </footer>
    </main>
</body>

</html>
