<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting Company</title>
    <meta name="description"
      content="Contact our Whitewater Rafting Company for inquiries, bookings, or more information about our exciting river adventures.">
    <meta name="author" content="Christian MAVINGA">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="grid">
            <img src="images/logo.jpg" alt="wwr company logo" width="200" height="100">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </div>
    </header>
    <main>
        <section>
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>
        <div>
            <form>
                <label for="username">Name</label>
                <input type="text" id="username" name="username">
            </form>
            <form>
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </form>
            <form>
                <label>Message Purpose</label>
                <input type="radio">
                <option>General Inquiry</option>
                <option>Reservation Question</option>
                <option>Website Suggestion</option>
            </form>
            <form>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>
            </form>
            <label><input type="checkbox" id="newsletter" name="newsletter">Please subscribe me to
                the monthly newsletter"</label>
            <button type="submit">Get in touch!</button>
            <figure>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d31826.4907289334!2d15.254589199999998!3d-4.35257405!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2scd!4v1780699450045!5m2!1sfr!2scd"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </figure>
        </div>
        <div>
            <figure>
                <img src="imges/africanwwr.webp" alt="employee1">
                <figcaption>Employee 1</figcaption>
            </figure>
            <figure>
                <img src="imges/africanwwr.webp" alt="employee2">
                <figcaption>Employee 2</figcaption>
            </figure>
            <figure>
                <img src="imges/africanwwr.webp" alt="employee3">
                <figcaption>Employee 3</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>©2026 🌴 Mavinga Nsuka Christian 🌴 Whitewater Rafting Company</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram">
            </a>
            <a href="https://LinkedIn.com">
                <img src="images/linkendin.jpg" alt="LinkedIn">
            </a>
        </nav>
    </footer>

</body>

</html>
