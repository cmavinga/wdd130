<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML Form - User Poll</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        header {
            max-width: 500px;
            margin: 0 auto;
            border-top: 1px solid black;
        }

        h1 {
            color: rgb(8, 8, 97);
            font-size: larger;
            margin: 10px;
            text-align: center;
        }

        form {
            display: grid;
            max-width: 500px;
            margin: 0 auto;
            padding: 1em;
            border: 1px solid #cccccc;
            border-radius: 1em;
            background-color: rgb(245, 242, 242);
        }

        /* je mets les sections dans un box */
        fieldset {
            display: grid;
            grid-gap: 10px;
            border: 1px solid #999;
            padding: 15px;
            margin-bottom: 15px;
        }

        legend {
            margin-top: 0;
            padding: 5px 0;
            font-size: small;
            color: rgb(8, 8, 97);
        }

        label,
        input,
        button,
        select,
        textarea {
            font-family: 'Times New Roman', Times, serif;
        }

        label {
            text-align: right;
            padding-right: 2px;
        }

        input,
        select,
        textarea {
            padding: 2px;
            font-size: larger;
        }

        /* The above is critical in order to provide spacing inside of the form input elements. */

        input[type="checkbox"] {
            width: 30px;
            height: auto;
            vertical-align: bottom;
        }

        button {
            margin: 0.5rem;
            background-color: rgb(131, 131, 241);
            color: aliceblue;
            font-size: large;
            border-radius: 1rem;
        }

        button:hover {
            background-color: gold;

        }

        footer {
            width: 500px;
            text-align: center;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <label for="fullname">Fullname:</label>
                <input type="text" id="fullname" name="fullname" required>
                <label for="email">Email Address:</label>
                <input type="email" id="useremail" name="useremail" required>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <label for="browser">What is your favorite browser</label>
                <select id="browser" name="browser">
                    <option value="1">Edge</option>
                    <option value="2">Safari</option>
                    <option value="3">Chrome</option>
                </select>
                <label for="pet">Do you have a household pet</label>
                <input type="checkbox" id="pet" name="pet">
                <label for="feedback">List the places you have lived</label>
                <textarea id="feedback" name="feedback" rows="6"
                  placeholder="Paris, Japan, Kinshasa, Kigali, Nairobi, Johannesburg"></textarea>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
</body>
<footer>
    <p>©2026 🌴 Mavinga Nsuka Christian 🌴 Kinshasa DR Congo</p>
</footer>

</html>
